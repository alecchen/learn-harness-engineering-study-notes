<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self';"
  />
  <title>Doc Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">Doc&nbsp;Chat</div>
    <button id="btn-open" class="btn">Open documents</button>
    <button id="btn-paste" class="btn">Paste text</button>
    <div id="status" class="status" title=""></div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="panel-title">Documents <span id="doc-count" class="muted"></span></div>
      <div id="doc-list" class="doc-list"></div>
      <div class="drop-hint">Drop files here or press Cmd/Ctrl+O</div>
    </aside>

    <section class="preview-pane">
      <div id="preview-meta" class="preview-meta hidden"></div>
      <div id="preview" class="preview"></div>
      <div id="preview-empty" class="empty">Select a document to read it.</div>
    </section>

    <section class="chat-pane">
      <div class="panel-title">
        <span>Ask about the documents</span>
        <select id="chat-scope" class="scope-select" title="Which documents questions should search"></select>
      </div>
      <div id="chat" class="chat"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <textarea id="chat-input" rows="2" placeholder="Ask a question about the documents..."></textarea>
        <div class="chat-actions">
          <span class="muted small" id="chat-hint"></span>
          <div class="chat-actions-right">
            <button type="button" id="btn-stop" class="btn hidden">Stop</button>
            <button type="submit" id="btn-send" class="btn primary">Ask</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <div id="drop-overlay" class="drop-overlay hidden"><div class="drop-box">Drop documents to open</div></div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>Paste a document</h3>
      <input id="paste-name" type="text" placeholder="Document name (optional)" />
      <textarea id="paste-text" rows="10" placeholder="Paste the text here..."></textarea>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn">Cancel</button>
        <button type="button" id="modal-add" class="btn primary">Add</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
