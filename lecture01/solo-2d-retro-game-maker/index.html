<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Game Maker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- Top Bar -->
  <header id="topbar">
    <div class="logo">&#x25A0; RETRO MAKER</div>
    <div class="mode-tabs">
      <button data-mode="level" class="mode-btn active">&#x25A3; Level</button>
      <button data-mode="sprite" class="mode-btn">&#x25C8; Sprite</button>
      <button id="entityMode" class="mode-btn">&#x25C6; Entity</button>
      <button data-mode="game" class="mode-btn run-btn">&#x25B6; Run</button>
    </div>
    <div class="top-actions">
      <button id="saveBtn" title="Save">&#x1F4BE;</button>
      <button id="newLevel" title="New Level">&#x2795;</button>
      <button id="exportBtn" title="Export Project">&#x1F4E4;</button>
      <button id="importBtn" title="Import Project">&#x1F4E5;</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <span class="zoom-ctrl">
        <button id="zoomOut">-</button>
        <button id="zoomIn">+</button>
      </span>
    </div>
  </header>

  <div id="main">
    <!-- Left Sidebar -->
    <aside id="sidebar">
      <!-- Level Editor Tools -->
      <div id="levelTools" class="panel-section">
        <div class="panel-title">Tools</div>
        <div class="tool-grid">
          <button data-tool="brush" class="tool-btn" title="Brush">&#x270E;</button>
          <button data-tool="eraser" class="tool-btn" title="Eraser">&#x2718;</button>
          <button data-tool="fill" class="tool-btn" title="Fill">&#x25A0;</button>
          <button data-tool="pick" class="tool-btn" title="Picker">&#x1F50D;</button>
          <button data-tool="entity" class="tool-btn" title="Place Entity">&#x25C6;</button>
        </div>
        <div class="panel-title" style="margin-top:8px">Layer</div>
        <div class="tool-grid">
          <button data-layer="bg" class="layer-btn">BG</button>
          <button data-layer="fg" class="layer-btn active">FG</button>
          <button data-layer="coll" class="layer-btn">COL</button>
        </div>
      </div>

      <!-- Sprite Editor Tools -->
      <div id="spriteTools" class="panel-section" style="display:none">
        <div class="panel-title">Draw</div>
        <div class="tool-grid">
          <button data-tool="pencil" class="tool-btn active" title="Pencil">&#x270E;</button>
          <button data-tool="fill" class="tool-btn" title="Fill">&#x25A0;</button>
          <button data-tool="line" class="tool-btn" title="Line">&#x2571;</button>
          <button data-tool="rect" class="tool-btn" title="Rect">&#x25AD;</button>
        </div>
        <div class="panel-title" style="margin-top:8px">Colors</div>
        <div id="colorPalette" class="color-grid"></div>
      </div>

      <!-- Palette: Tiles -->
      <div id="tilePalette" class="panel-section">
        <div class="panel-title">Tiles</div>
        <div id="palette" class="palette-grid"></div>
      </div>

      <!-- Palette: Entities -->
      <div id="entityPalettePanel" class="panel-section">
        <div class="panel-title">Entities <small>(click to place)</small></div>
        <div id="entityPaletteGrid" class="palette-grid"></div>
      </div>

      <!-- Palette: Sprites -->
      <div id="spritePalettePanel" class="panel-section" style="display:none">
        <div class="panel-title">Sprites</div>
        <div id="spritePaletteGrid" class="palette-grid"></div>
        <button id="addSprite" class="action-btn" style="margin-top:4px">+ Add Sprite</button>
      </div>

      <!-- Sprite Frames -->
      <div id="spriteFrames" class="panel-section" style="display:none">
        <div class="panel-title">Frames</div>
        <div class="frame-actions">
          <button id="addFrame" class="action-btn">+</button>
          <button id="dupFrame" class="action-btn">Dup</button>
          <button id="delFrame" class="action-btn">-</button>
          <button id="animToggle" class="action-btn">Anim</button>
        </div>
      </div>

      <!-- Entity Types -->
      <div id="entityTypes" class="panel-section" style="display:none">
        <div class="panel-title">Entity Types</div>
        <div id="entityTypeList" class="list"></div>
        <button id="addEntityType" class="action-btn">+ Add Type</button>
      </div>

      <!-- Entity Properties -->
      <div id="entityProps" class="panel-section" style="display:none">
        <div class="panel-title">Entity Props</div>
        <div id="entityPropContent" class="prop-content">Select an entity</div>
        <button id="applyEntityProps" class="action-btn">Apply</button>
      </div>
    </aside>

    <!-- Main Canvas -->
    <main id="canvas-area">
      <canvas id="mainCanvas" tabindex="0"></canvas>
    </main>

    <!-- Right Sidebar -->
    <aside id="rightbar">
      <div id="levelProps" class="panel-section">
        <div class="panel-title">Levels</div>
        <div id="levelList" class="list"></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">Sprites</div>
        <div id="spriteList" class="list"></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">Info</div>
        <div class="info-panel" id="infoPanel">
          <small>Brush: tile on FG layer<br>
          Shift+click: pan<br>
          Delete: remove selected entity</small>
        </div>
      </div>
    </aside>
  </div>

  <!-- Status Bar -->
  <footer id="statusbar">
    <span id="statusText">Ready</span>
    <span id="cursorPos">-</span>
  </footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
